<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal Search</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div id="app">
        <header class="header">
            <div class="search-wrap">
                <span class="icon">🔎</span>
                <input id="search" placeholder="Search clipboard, tabs, history & bookmarks…" autofocus />
                <button id="clear" title="Clear" class="btn icon">✕</button>
                <button id="save-clipboard-mini" title="Add current clipboard" class="chip mini">➕</button>
            </div>
            <div class="chips" id="chips">
                <button data-filter="All" class="chip active">All</button>
                <button data-filter="clipboard" class="chip">Clipboard</button>
                <button data-filter="tabs" class="chip">Tabs</button>
                <button data-filter="history" class="chip">History</button>
                <button data-filter="bookmarks" class="chip">Bookmarks</button>
                <button data-filter="downloads" class="chip">Downloads</button>
                <button data-filter="pinned" class="chip">Pinned</button>
            </div>
            <div class="chips" id="refine" style="display:none"></div>
        </header>
        <section id="roast" class="roast hidden"></section>
        <section id="ai" class="ai group collapsible hidden">
            <div class="group-title"><span class="caret">▾</span><span>🤖 AI Response</span></div>
            <div class="ai-body">
                <div id="ai-text" class="ai-text"></div>
            </div>
        </section>
        <main id="results"></main>
        <footer class="footer">
            <span id="toast" class="toast"></span>
        </footer>
        <div id="modal" class="modal">
            <div class="card">
                <div style="font-weight:700;color:#9db0cc">Add to Clipboard Memory</div>
                <input id="modal-label" placeholder="Optional label/tag" />
                <textarea id="modal-content" rows="4" placeholder="Content"></textarea>
                <div class="row">
                    <button id="modal-cancel" class="btn">Cancel</button>
                    <button id="modal-save" class="btn primary">Save</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>

</html>

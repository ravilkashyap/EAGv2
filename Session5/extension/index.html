<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Agent</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendor/katex.min.css" />
</head>

<body>
    <div id="app" class="fullpage">
        <header>
            <div class="title">Math Agent</div>
            <div class="actions">
                <button id="themeToggle" title="Toggle theme">☾</button>
            </div>
        </header>

        <div class="container">
            <aside class="sidebar">
                <div class="brand">🧮</div>
                <div class="menu">
                    <div class="item active">Chat</div>
                    <div class="item">History</div>
                </div>
            </aside>
            <main id="chat" class="drop-zone">
                <div id="health" class="banner" hidden>Connecting to backend…</div>
                <div id="messages" aria-live="polite"></div>
                <div id="timeline" class="timeline"></div>
                <div id="dropHint" class="drop-hint">Drop image to attach</div>
            </main>
        </div>

        <footer>
            <button id="attachBtn" title="Attach image">📎</button>
            <input type="file" id="fileInput" accept="image/*" hidden />
            <div id="chips" class="chips"></div>
            <textarea id="text" placeholder="Ask a math question… Paste or drop an image" rows="2"></textarea>
            <div class="right-controls">
                <button id="send" class="primary">Send</button>
            </div>
        </footer>
    </div>

    <div id="toast" class="toast" hidden></div>

    <div id="stepsModal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Tool history</div>
                <div class="toolbar">
                    <button id="expandAll" title="Expand all">▾</button>
                    <button id="collapseAll" title="Collapse all">▸</button>
                    <button id="copyStepsHdr" class="copy" title="Copy">⎘</button>
                    <button id="closeSteps" title="Close">✕</button>
                </div>
            </div>
            <div id="stepsContainer" class="cards"></div>
        </div>
    </div>

    <div id="imgModal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Attachment</div>
                <button id="closeImg" title="Close">✕</button>
            </div>
            <img id="imgPreview" style="width:100%;height:auto;display:block" />
        </div>
    </div>

    <script src="vendor/katex.min.js"></script>
    <script src="page.js"></script>
</body>

</html>
